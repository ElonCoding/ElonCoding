name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Main Dashboard Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AkshitTiwarii
          template: classic
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata

          # 1. FORCE TWO-COLUMN HORIZONTAL GRID
          config_twocolumns: true
          
          # 2. ESSENTIAL PROFILE STATS ONLY (Removed discussions & bloat)
          base: header, activity, community, repositories
          
          # 3. 3D ISOMETRIC CONTRIBUTION CALENDAR
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 4. CLEAN LANGUAGE BREAKDOWN (Top 6 only)
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_sections: most-used

          # 5. CODING HABITS & STREAKS
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # 6. TECH STACK ICONS GRID
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
